<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Selfbot VC</title>
<style>
  :root {
    --bg: #0e0f11; --bg2: #161719; --bg3: #1e1f22; --bg4: #2b2d31;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #e8e9ea; --text2: #9a9b9e; --text3: #5c5e63;
    --accent: #5865f2; --accent-light: #7983f5;
    --green: #23a55a; --green-bg: rgba(35,165,90,0.12);
    --red: #f23f43; --red-bg: rgba(242,63,67,0.12);
    --yellow: #f0b132; --yellow-bg: rgba(240,177,50,0.1);
    --radius: 8px; --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'SF Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 10px; }

  .header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 8px; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo { width: 36px; height: 36px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .logo svg { width: 20px; height: 20px; }
  .app-name { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .app-sub { font-size: 12px; color: var(--text3); }
  .pill { font-size: 11px; font-weight: 600; padding: 5px 11px; border-radius: 20px; background: var(--bg3); color: var(--text3); border: 1px solid var(--border); display: flex; align-items: center; gap: 5px; letter-spacing: 0.02em; transition: all 0.2s; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); transition: background 0.2s; }
  .pill.online { color: var(--green); border-color: rgba(35,165,90,0.3); background: var(--green-bg); }
  .pill.online .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .pill.in-vc { color: var(--accent-light); border-color: rgba(88,101,242,0.3); background: rgba(88,101,242,0.1); }
  .pill.in-vc .dot { background: var(--accent-light); box-shadow: 0 0 6px var(--accent-light); }

  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 15px 16px; }
  .card-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; }

  .input-wrap { position: relative; }
  .input-wrap .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; display: flex; }
  .input-wrap .ico svg { width: 15px; height: 15px; }
  input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--font); font-size: 14px; padding: 10px 10px 10px 36px; outline: none; transition: border-color 0.15s; -webkit-appearance: none; }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text3); }
  input:disabled { opacity: 0.5; }

  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input { flex: 1; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-family: var(--font); font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: var(--radius); cursor: pointer; transition: background 0.1s, transform 0.08s; white-space: nowrap; }
  .btn:hover { background: var(--bg4); }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .btn.primary { background: var(--accent); border-color: transparent; color: white; }
  .btn.primary:hover { background: #4752c4; }
  .btn.danger { color: var(--red); border-color: rgba(242,63,67,0.3); background: var(--red-bg); }
  .btn.success { color: var(--green); border-color: rgba(35,165,90,0.3); background: var(--green-bg); }
  .btn.sm { padding: 8px 11px; font-size: 13px; }
  .btn.sm svg { width: 14px; height: 14px; }
  .btn.icon-only { padding: 10px; }

  .user-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
  .user-name { font-size: 14px; font-weight: 600; }
  .user-sub { font-size: 11px; color: var(--text3); }
  .ml { margin-left: auto; }

  .vc-bar { display: flex; align-items: center; gap: 9px; padding: 10px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; }
  .vc-bar svg { width: 16px; height: 16px; color: var(--text3); flex-shrink: 0; }
  .vc-bar .vc-label { font-size: 13px; color: var(--text2); }
  .vc-bar.active svg { color: var(--accent-light); }
  .vc-bar.active .vc-label { color: var(--text); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .toggle-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .toggle { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text2); font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .toggle svg { width: 17px; height: 17px; flex-shrink: 0; }
  .toggle:hover { background: var(--bg4); }
  .toggle.on { background: var(--red-bg); border-color: rgba(242,63,67,0.3); color: var(--red); }

  .log-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; height: 160px; overflow-y: auto; font-family: var(--mono); font-size: 11.5px; line-height: 1.65; }
  .log-box::-webkit-scrollbar { width: 3px; }
  .log-box::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
  .ll { display: flex; gap: 8px; }
  .lt { color: var(--text3); flex-shrink: 0; }
  .ll.ok .lm { color: var(--green); }
  .ll.error .lm { color: var(--red); }
  .ll.warn .lm { color: var(--yellow); }
  .ll.info .lm { color: var(--text2); }

  .banner { display: none; align-items: center; gap: 8px; padding: 10px 13px; background: var(--yellow-bg); border: 1px solid rgba(240,177,50,0.25); border-radius: var(--radius); font-size: 12px; color: var(--yellow); }
  .banner.show { display: flex; }
  .banner svg { width: 15px; height: 15px; flex-shrink: 0; }

  .warn-footer { text-align: center; padding: 12px 0 8px; font-size: 11px; color: var(--text3); }

  .server-setup { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 15px 16px; }
  .server-setup p { font-size: 13px; color: var(--text2); margin-bottom: 10px; line-height: 1.6; }
  .code-block { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-family: var(--mono); font-size: 12px; color: var(--accent-light); white-space: pre; overflow-x: auto; margin-bottom: 8px; }
  .server-url-row { display: flex; gap: 8px; align-items: center; }
  .server-url-row input { flex: 1; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 18v-6a9 9 0 0118 0v6"/>
          <path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z" stroke="white" stroke-width="2" fill="none"/>
        </svg>
      </div>
      <div>
        <div class="app-name">Selfbot VC</div>
        <div class="app-sub">Voice channel controller</div>
      </div>
    </div>
    <div class="pill" id="pill">
      <span class="dot"></span>
      <span id="pill-txt">Offline</span>
    </div>
  </div>

  <!-- Server connection -->
  <div class="server-setup" id="server-card">
    <div class="card-label">Server</div>
    <p>Run <code style="color:var(--accent-light);font-family:var(--mono)">node server.js</code> in Termux, then connect here.</p>
    <div class="server-url-row">
      <input type="text" id="server-url" value="ws://localhost:3000" placeholder="ws://localhost:3000">
      <button class="btn primary" id="ws-btn" onclick="connectWS()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Connect
      </button>
    </div>
    <div class="banner" id="ws-banner" style="margin-top:8px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="banner-txt">Not connected to server</span>
    </div>
  </div>

  <!-- Bot login -->
  <div class="card">
    <div class="card-label">Account</div>
    <div class="input-wrap">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
      <input type="password" id="token-input" placeholder="Paste your user token">
    </div>
    <div class="row">
      <button class="btn primary" id="bot-btn" onclick="handleBotConnect()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        Login
      </button>
      <button class="btn sm icon-only" onclick="toggleVis()" title="Show token">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="user-row" id="user-row" style="display:none">
      <div class="avatar" id="av">?</div>
      <div>
        <div class="user-name" id="uname">—</div>
        <div class="user-sub">Logged in</div>
      </div>
      <div class="ml">
        <button class="btn sm danger" onclick="handleBotDisconnect()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Logout
        </button>
      </div>
    </div>
  </div>

  <!-- Voice channel -->
  <div class="card">
    <div class="card-label">Voice channel</div>
    <div class="vc-bar" id="vc-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span class="vc-label" id="vc-lbl">Not in a voice channel</span>
    </div>
    <div class="input-wrap" style="margin-bottom:8px">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <input type="text" id="ch-id" placeholder="Channel ID (right-click channel → Copy ID)">
    </div>
    <div class="grid2">
      <button class="btn success" onclick="vcCmd('join')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Join VC
      </button>
      <button class="btn danger" onclick="vcCmd('leave')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Leave VC
      </button>
      <button class="btn" onclick="vcCmd('rejoin')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Rejoin
      </button>
      <button class="btn" onclick="vcCmd('move')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
        Move to ID
      </button>
    </div>
    <div class="toggle-row">
      <button class="toggle" id="mute-btn" onclick="doToggle('mute')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
        Mute
      </button>
      <button class="toggle" id="deaf-btn" onclick="doToggle('deafen')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0118 0v6"/><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/></svg>
        Deafen
      </button>
    </div>
  </div>

  <!-- Log -->
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="card-label" style="margin:0">Activity log</div>
      <button class="btn sm" onclick="document.getElementById('log').innerHTML=''">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2"/></svg>
        Clear
      </button>
    </div>
    <div class="log-box" id="log"></div>
  </div>

  <div class="warn-footer">⚠️ Selfbots violate Discord's ToS — use at your own risk</div>
</div>

<script>
let ws = null, retryTimer = null;
let S = { ws: false, bot: false, inVC: false, chId: null, muted: false, deafened: false, user: null };

function connectWS() {
  const url = document.getElementById('server-url').value.trim() || 'ws://localhost:3000';
  if (ws && ws.readyState < 2) { ws.close(); }
  clearInterval(retryTimer);
  log('Connecting to ' + url + '…', 'info');

  try { ws = new WebSocket(url); } catch(e) { log('Invalid URL', 'error'); return; }

  ws.onopen = () => {
    S.ws = true;
    document.getElementById('ws-banner').classList.remove('show');
    document.getElementById('ws-btn').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg> Disconnect`;
    log('Server connected', 'ok');
    render();
  };

  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'log') log(m.text, m.level || 'info');
    else if (m.type === 'state') {
      if (m.connected !== undefined) S.bot = m.connected;
      if (m.inVC !== undefined) S.inVC = m.inVC;
      if (m.channelId !== undefined) S.chId = m.channelId;
      if (m.muted !== undefined) S.muted = m.muted;
      if (m.deafened !== undefined) S.deafened = m.deafened;
      if (m.username !== undefined) S.user = m.username;
      render();
    }
  };

  ws.onclose = () => {
    S.ws = false; S.bot = false;
    document.getElementById('ws-banner').classList.add('show');
    document.getElementById('banner-txt').textContent = 'Disconnected — retrying…';
    document.getElementById('ws-btn').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Connect`;
    retryTimer = setTimeout(connectWS, 4000);
    render();
  };

  ws.onerror = () => {};
}

function send(obj) {
  if (!ws || ws.readyState !== 1) { log('Not connected to server', 'error'); return false; }
  ws.send(JSON.stringify(obj)); return true;
}

function handleBotConnect() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) { log('Enter a token first', 'error'); return; }
  send({ action: 'connect', token: t });
}

function handleBotDisconnect() { send({ action: 'disconnect' }); }

function vcCmd(action) {
  if (!S.bot) { log('Not logged in', 'error'); return; }
  const ch = document.getElementById('ch-id').value.trim();
  if ((action === 'join' || action === 'move') && !ch) {
    log('Enter a channel ID first', 'error');
    document.getElementById('ch-id').focus(); return;
  }
  send({ action, channelId: ch });
}

function doToggle(type) {
  if (!S.bot) { log('Not logged in', 'error'); return; }
  if (type === 'mute') send({ action: 'mute', value: !S.muted });
  else send({ action: 'deafen', value: !S.deafened });
}

function toggleVis() {
  const i = document.getElementById('token-input');
  i.type = i.type === 'password' ? 'text' : 'password';
}

function render() {
  const pill = document.getElementById('pill');
  const pillTxt = document.getElementById('pill-txt');
  pill.className = 'pill';
  if (S.inVC) { pill.classList.add('in-vc'); pillTxt.textContent = 'In VC'; }
  else if (S.bot) { pill.classList.add('online'); pillTxt.textContent = 'Online'; }
  else pillTxt.textContent = 'Offline';

  const urow = document.getElementById('user-row');
  const bbtn = document.getElementById('bot-btn');
  if (S.bot && S.user) {
    urow.style.display = 'flex';
    document.getElementById('uname').textContent = S.user;
    document.getElementById('av').textContent = S.user.replace(/#\d+$/, '').slice(0,2).toUpperCase();
    bbtn.style.display = 'none';
    document.getElementById('token-input').disabled = true;
  } else {
    urow.style.display = 'none';
    bbtn.style.display = 'inline-flex';
    document.getElementById('token-input').disabled = false;
  }

  const vcBar = document.getElementById('vc-bar');
  const vcLbl = document.getElementById('vc-lbl');
  if (S.inVC && S.chId) { vcBar.classList.add('active'); vcLbl.textContent = 'Channel ' + S.chId; }
  else { vcBar.classList.remove('active'); vcLbl.textContent = 'Not in a voice channel'; }

  const mb = document.getElementById('mute-btn');
  const db = document.getElementById('deaf-btn');
  mb.className = 'toggle' + (S.muted ? ' on' : '');
  mb.lastChild.textContent = S.muted ? ' Unmute' : ' Mute';
  db.className = 'toggle' + (S.deafened ? ' on' : '');
  db.lastChild.textContent = S.deafened ? ' Undeafen' : ' Deafen';
}

function log(text, level = 'info') {
  const box = document.getElementById('log');
  const l = document.createElement('div');
  l.className = 'll ' + level;
  const t = new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  l.innerHTML = `<span class="lt">${t}</span><span class="lm">${text}</span>`;
  box.appendChild(l);
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 300) box.removeChild(box.firstChild);
}

// Auto-connect to server on load
log('App started', 'info');
document.getElementById('ws-banner').classList.add('show');
document.getElementById('banner-txt').textContent = 'Start server.js in Termux first, then tap Connect';
render();
</script>
</body>
</html>
